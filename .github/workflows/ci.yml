# Lint + unit + integration + E2E tests.
# Phase 9 (tasks 9.1–9.3): integration and E2E jobs added here.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly E2E run at 03:00 UTC on master
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E tests"
        required: false
        default: "false"
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check hopsnvectors/ tests/
        working-directory: app
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
      - name: shellcheck (entrypoint)
        run: shellcheck app/entrypoint.sh
      - name: shellcheck (e2e script)
        run: shellcheck scripts/e2e.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests exercise parsing/hash/validation logic only; the heavy
      # ML deps (torch, sentence-transformers) are imported lazily and are
      # not needed here.
      - run: pip install "psycopg[binary]>=3.1" "pgvector>=0.3" pytest
      - run: python -m pytest tests --ignore=tests/integration -q
        working-directory: app

  integration-tests:
    runs-on: ubuntu-latest
    # Integration tests pull pgvector/pgvector:pg18 via testcontainers — Docker
    # is available on ubuntu-latest GitHub-hosted runners.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all test dependencies
        run: >
          pip install
          "psycopg[binary]>=3.1"
          "pgvector>=0.3"
          "testcontainers[postgres]>=4.0"
          "numpy>=1.26"
          pytest pytest-cov
        working-directory: app
      - name: Run unit + integration tests with coverage gate (≥ 80 %)
        run: >
          python -m pytest tests -q
          --cov=hopsnvectors --cov-report=term-missing --cov-fail-under=80
        working-directory: app

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  e2e:
    # Run nightly, on manual dispatch with run_e2e=true, or on workflow_dispatch.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ── Docker layer cache ──────────────────────────────────────────────
      # Pre-build the scheduler image using GHA cache so that torch +
      # sentence-transformers wheels are not re-downloaded on every run.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scheduler image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: hops-n-vectors-scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── HuggingFace model cache ─────────────────────────────────────────
      # Cache the ~90 MB model weights so the scheduler container starts
      # without a network download.  MODEL_CACHE_PATH is a bind-mount path
      # that docker-compose substitutes for the named model-cache volume;
      # because it is a bind mount, `docker compose down -v` does not wipe it.
      - name: Restore HuggingFace model cache
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hf-cache
          key: hf-all-MiniLM-L12-v2-v1

      - name: Pre-download HuggingFace model (cache miss only)
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/hf-cache
          docker run --rm \
            -v /tmp/hf-cache:/model-cache \
            -e HF_HOME=/model-cache \
            hops-n-vectors-scheduler:latest \
            python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L12-v2')
          print('Model pre-downloaded.')
          "

      - name: Copy env file
        run: cp .env.example .env 2>/dev/null || cp .env .env || true

      - name: Run E2E script
        env:
          MODEL_CACHE_PATH: /tmp/hf-cache
        run: bash scripts/e2e.sh

