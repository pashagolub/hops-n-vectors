services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro

  # Single tools container (spec v1.2 §4.1): entrypoint runs
  # loader -> embedder -> exec pg_timetable.  The rebuild_embeddings job is a
  # pg_timetable PROGRAM task invoking the embedder in this same container.
  # TUI: docker compose run --rm scheduler tui
  scheduler:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE}
      REBUILD_SCHEDULE: ${REBUILD_SCHEDULE}
      TOP_N_DEFAULT: ${TOP_N_DEFAULT}
      HF_HOME: /model-cache
    volumes:
      - ./data:/data:ro
      - ./init:/app/init:ro
      - model-cache:/model-cache
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

volumes:
  pgdata:
  model-cache:
